name: CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: Build, tests and quality
    runs-on: ubuntu-latest
    services:
      database:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: execution
          MONGO_INITDB_ROOT_PASSWORD: integration-password
        ports: ['27017:27017']
    env:
      TEST_DATABASE_URL: mongodb://execution:integration-password@localhost:27017/integration?authSource=admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run quality
      - run: npm run test:cov
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-execution
          path: coverage
  container:
    name: Container build
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
  deploy:
    name: Kubernetes rollout
    needs: container
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: fase4
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - run: kubectl apply -k k8s/base
      - run: kubectl -n oficina-execution set image deployment/oficina-execution-service api=ghcr.io/${{ github.repository }}:${{ github.sha }}
      - run: kubectl -n oficina-execution rollout status deployment/oficina-execution-service --timeout=180s
      - name: Validate deployed readiness
        run: |
          kubectl -n oficina-execution port-forward service/oficina-execution-service 3000:3000 > /tmp/port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/ready; then exit 0; fi
            sleep 1
          done
          exit 1
