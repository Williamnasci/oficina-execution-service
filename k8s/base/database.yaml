apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  clusterIP: None
  selector: { app: oficina-execution-service-database }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oficina-execution-service-database
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels: { app: oficina-execution-service-database }
  template:
    metadata:
      labels: { app: oficina-execution-service-database }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: database
          image: mongo:8
          ports: [{ containerPort: 27017 }]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: execution
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: service-secrets, key: DATABASE_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /data/db }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
