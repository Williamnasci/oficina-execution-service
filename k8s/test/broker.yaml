apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: { app: test-rabbitmq }
  ports: [{ port: 5672, targetPort: 5672 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels: { app: test-rabbitmq }
  template:
    metadata:
      labels: { app: test-rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-alpine
          ports: [{ containerPort: 5672 }]
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: integration }
            - { name: RABBITMQ_DEFAULT_PASS, value: integration-password }
          readinessProbe:
            tcpSocket: { port: 5672 }
            initialDelaySeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 768Mi }
